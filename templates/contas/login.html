{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4">
      <h2 class="mb-4">Login</h2>

      <form method="post">
          {% csrf_token %}

          <div class="mb-3">
              <label for="email" class="form-label">
                  Email
              </label>

              <input
                  id="email"
                  class="form-control"
                  type="email"
                  name="email"
                  value="{{ request.POST.email|default:'' }}"
                  required
              >
          </div>

          <div class="mb-3">
              <label for="senha" class="form-label">
                  Senha
              </label>

              <input
                  id="senha"
                  class="form-control"
                  type="password"
                  name="senha"
                  required
              >
          </div>

          <button
              class="btn btn-primary w-100"
              type="submit"
          >
              Entrar
          </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
