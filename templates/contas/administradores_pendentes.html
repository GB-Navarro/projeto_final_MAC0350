{% extends "base.html" %}

{% block content %}

<h1 class="mb-4">Administradores pendentes</h1>

<div class="card">
    <ul class="list-group list-group-flush">
        {% for admin in administradores %}

        <li class="list-group-item d-flex justify-content-between align-items-center flex-wrap gap-2">
            <span class="text-break">
                {{ admin.usuario.email }}
                <span class="badge badge-pendente ms-2">Pendente</span>
            </span>

            <form method="post" action="{% url 'contas:aprovar_administrador' admin.id %}" class="mb-0">
                {% csrf_token %}

                <button type="submit" class="btn btn-primary btn-sm">
                    Aprovar
                </button>
            </form>
        </li>

        {% empty %}

        <li class="list-group-item text-center text-body-secondary">
            Nenhum administrador pendente.
        </li>

        {% endfor %}
    </ul>
</div>

{% endblock %}
